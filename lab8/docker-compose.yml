services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5442:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=todo_db

  test_db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_test_data:/var/lib/postgresql/data/
    ports:
      - "5443:5432"
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=test_db

volumes:
  postgres_data:
  postgres_test_data:
